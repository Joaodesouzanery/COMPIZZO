<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("compizzo.theme")||"light";if(t==="auto")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compizzo Admin</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><img src="assets/logo.svg" alt="Compizzo"><b>Compizzo</b></div>
    <div class="obra-pick"><span class="mono">OBRA / CONTRATO</span><select id="obraSel"></select></div>
    <div class="mono sec">WORKSPACE</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <label class="mono" style="margin-top:2px">Aparência</label><select id="themeSel"><option value="light">Claro</option><option value="dark">Escuro (cinza)</option><option value="auto">Automático</option></select>
      <button class="btn ghost sm" id="btnExport">Exportar dados</button>
      <button class="btn ghost sm" id="btnReset">Restaurar base</button>
    </div>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>
<div id="modal" class="modal" hidden><div class="mbox" id="mbox"></div></div>
<script src="assets/app.js"></script>
<script src="assets/cadastros.js"></script>
<script src="assets/prod.js"></script>
<script src="assets/caixa.js"></script>
<script src="assets/geral.js"></script>
<script src="assets/desempenho.js"></script>
<script src="assets/pend.js"></script>
<script src="assets/contratos.js"></script>
<script src="assets/apontamento.js"></script>
<script src="assets/resultado.js"></script>
<script src="assets/theme.js"></script>
<script src="assets/boot.js"></script>
</body></html>
